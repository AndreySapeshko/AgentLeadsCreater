[project]
name = "agentresearcher"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    # Линтеры и форматтеры
    "black (>=24.0)",
    "isort (>=5.12)",
    "flake8 (>=6.0)",
    "mypy (>=1.0)",
    "pre-commit (>=3.0)",

    # Тестирование
    "pytest (>=7.0)",
    "pytest-cov (>=4.0)",
    "pytest-asyncio (>=0.21)",

    # Документация
    "sphinx (>=7.0)",
    "sphinx-rtd-theme (>=1.0)",

    # Утилиты
    "python-dotenv (>=1.0)",
    "ipython (>=8.0)",
    "openai (>=2.11.0,<3.0.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "aiogram (>=3.23.0,<4.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true

[tool.flake8]
max-line-length = 119
extend-ignore = "E203, W503"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "migrations",
    "build",
    "dist",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
